services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: order_resolver
      POSTGRES_USER: order_resolver
      POSTGRES_PASSWORD: order_resolver
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_resolver -d order_resolver"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
