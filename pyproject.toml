[project]
name = "order-resolver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.2"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.10",
    "pgvector>=0.5.0",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
order-resolver = "order_resolver:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
