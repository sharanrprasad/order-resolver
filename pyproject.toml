[project]
name = "order-resolver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.2"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.1",
]

[project.scripts]
order-resolver = "order_resolver:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "httpx2>=2.12.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the ``tests`` package importable so suites can share helper modules.
pythonpath = ["."]
addopts = "--strict-markers"
# "auto" lets async test functions and async fixtures run without a per-item
# @pytest.mark.asyncio / @pytest_asyncio.fixture marker.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated test with no I/O or external services",
    "integration: drives the FastAPI app against a real Postgres database (deterministic mocked LLM)",
]
